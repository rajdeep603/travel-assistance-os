# Shared http-level settings (included once from the active server config).
server_tokens off;

# Rate limits per client IP. Bursts absorb normal demo clicking; sustained
# abuse gets 429s before it reaches the app or the paid AI/telephony APIs.
limit_req_zone $binary_remote_addr zone=taap_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=taap_ai:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=taap_calls:10m rate=6r/m;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
