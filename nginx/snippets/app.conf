# Application routes, shared by the HTTP-only and HTTPS server blocks.

client_max_body_size 15m;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;

# Docker's embedded DNS: resolve services per request, so a stopped optional
# service (e.g. the voice gateway) yields a 502 instead of nginx refusing to start.
resolver 127.0.0.11 valid=30s ipv6=off;

location = /api/health {
    proxy_pass http://app:3000/api/health;
    include /etc/nginx/taap/snippets/proxy.conf;
    access_log off;
}

location = /api/auth/login {
    limit_req zone=taap_auth burst=5 nodelay;
    proxy_pass http://app:3000;
    include /etc/nginx/taap/snippets/proxy.conf;
}

# A claim pack is several documents in one request.
location = /api/claims/upload {
    limit_req zone=taap_ai burst=10 nodelay;
    client_max_body_size 90m;
    proxy_pass http://app:3000;
    include /etc/nginx/taap/snippets/proxy.conf;
    proxy_read_timeout 300s;
}

# Routes that call the AI provider.
location ~ ^/api/(cases/analyze|assistant/ask|documents|documents/sample|claims/sample|claims/[^/]+/review|public/upload/[^/]+)$ {
    limit_req zone=taap_ai burst=10 nodelay;
    proxy_pass http://app:3000;
    include /etc/nginx/taap/snippets/proxy.conf;
}

# Placing phone calls costs money: outbound and interpreter calls only.
location ~ ^/api/calls/(outbound|interpreter)$ {
    limit_req zone=taap_calls burst=3 nodelay;
    proxy_pass http://app:3000;
    include /etc/nginx/taap/snippets/proxy.conf;
}

# Long-lived WebSockets (voice gateway: browser audio, Twilio media streams).
location ^~ /ws/ {
    set $gateway http://voice-gateway:8080;
    proxy_pass $gateway;
    include /etc/nginx/taap/snippets/proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location / {
    proxy_pass http://app:3000;
    include /etc/nginx/taap/snippets/proxy.conf;
}
